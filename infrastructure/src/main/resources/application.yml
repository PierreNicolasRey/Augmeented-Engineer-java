spring:
  application:
    name: belair-buvette

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:belair-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20

  # H2 Console Configuration (for development)
  h2:
    console:
      enabled: true
      path: /h2-console
